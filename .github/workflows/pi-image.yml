name: Pi image

# Builds the flashable Raspberry Pi image (Ubuntu Server 24.04 + Marqueet's
# first-boot setup). edge.yml calls this and publishes the image with the
# snaps.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths: ["packaging/pi-image/**", "packaging/tv-output/**", "install.sh", ".github/workflows/pi-image.yml"]

permissions:
  contents: read

jobs:
  image:
    name: Raspberry Pi image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the scripts and cloud-init config
        run: |
          shellcheck install.sh packaging/pi-image/build.sh packaging/pi-image/firstboot.sh packaging/pi-image/devssh.sh \
            packaging/tv-output/marqueet-tv-output.sh packaging/tv-output/test.sh
          sh packaging/tv-output/test.sh
          for f in packaging/pi-image/*.service packaging/pi-image/*.timer packaging/pi-image/*.path; do
            systemd-analyze verify --man=no "$f" 2>&1 | grep -v "Command /bin/sh.*is not executable\|Failed to prepare" || true
          done
      - name: The first-boot screen shows plain progress
        run: |
          fake="$RUNNER_TEMP/fake-install.sh"
          printf '%s\n' '#!/bin/sh' 'printf "\033[1;33m==>\033[0m Installing Ubuntu Frame\n"' 'echo noise' 'printf "\033[1;33m==>\033[0m Downloading Marqueet\n"' > "$fake"
          MARQUEET_TTY="$RUNNER_TEMP/screen.txt" MARQUEET_INSTALLER="$fake" MARQUEET_LOG="$RUNNER_TEMP/install.log" \
            MARQUEET_ONLINE_CHECK=true sh packaging/pi-image/firstboot.sh
          cat "$RUNNER_TEMP/screen.txt"
          grep -q "All set! Starting the ticker" "$RUNNER_TEMP/screen.txt"
          grep -q "noise" "$RUNNER_TEMP/install.log"
          printf '%s\n' '#!/bin/sh' 'exit 3' > "$fake"
          if MARQUEET_TTY="$RUNNER_TEMP/screen.txt" MARQUEET_INSTALLER="$fake" MARQUEET_LOG="$RUNNER_TEMP/install.log" \
            MARQUEET_ONLINE_CHECK=true sh packaging/pi-image/firstboot.sh; then exit 1; fi
          grep -q "Trying again in a minute" "$RUNNER_TEMP/screen.txt"
      - name: The developer switch turns key-only SSH on and off
        run: |
          t="$RUNNER_TEMP/devssh"; mkdir -p "$t/boot" "$t/home" "$t/sshd"
          log="$t/systemctl.log"
          printf '%s\n' '#!/bin/sh' "echo \"\$*\" >> $log" > "$t/systemctl"; chmod +x "$t/systemctl"
          run() {
            MARQUEET_BOOT="$t/boot" MARQUEET_SSHD_DIR="$t/sshd" MARQUEET_SYSTEMCTL="$t/systemctl" \
              MARQUEET_KEYGEN=true MARQUEET_CHOWN=true MARQUEET_DEV_USER=pi MARQUEET_DEV_HOME="$t/home" \
              MARQUEET_DEV_GROUP=pi sh packaging/pi-image/devssh.sh
          }
          run; test ! -e "$log"                                   # no file: nothing happens
          key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJq7bogusbogusbogusbogusbogusbogusbogus dev@laptop'
          printf '%s\r\n%s\n' 'command="rm -rf /" ssh-ed25519 AAAAbad' "$key" > "$t/boot/marqueet-ssh-key.pub.txt"
          run
          test "$(cat "$t/home/.ssh/authorized_keys")" = "$key"  # the key, not the one with options
          grep -qx 'PasswordAuthentication no' "$t/sshd/10-marqueet-keys-only.conf"
          grep -qx 'enable --now ssh.service' "$log"
          test -e "$t/boot/marqueet-ssh-key.applied"
          echo "$key" > "$t/boot/marqueet-ssh-key.pub"; run
          test "$(wc -l < "$t/home/.ssh/authorized_keys")" -eq 1   # added once
          echo 'not a key' > "$t/boot/marqueet-ssh-key.pub"; : > "$log"; run
          test -e "$t/boot/marqueet-ssh-key.invalid"; test ! -s "$log"
          touch "$t/boot/marqueet-ssh-off"; run
          grep -qx 'mask ssh.service ssh.socket' "$log"
          test ! -e "$t/sshd/10-marqueet-keys-only.conf"; test ! -e "$t/boot/marqueet-ssh-off"
      - name: Build
        run: packaging/pi-image/build.sh dist
      - name: The image has Marqueet's setup
        run: |
          xz -dc dist/marqueet-pi.img.xz > "$RUNNER_TEMP/check.img"
          loop=$(sudo losetup -Pf --show "$RUNNER_TEMP/check.img")
          b="$RUNNER_TEMP/boot"; r="$RUNNER_TEMP/root"
          mkdir -p "$b" "$r"
          sudo mount -o ro "${loop}p1" "$b"
          sudo mount -o ro "${loop}p2" "$r"
          test -f "$b/marqueet/install.sh"
          test -f "$b/marqueet/firstboot.sh"
          test -f "$b/marqueet/devssh.sh"
          test -f "$b/MARQUEET-README.txt"
          grep -q "#cloud-config" "$b/user-data"   # Ubuntu's own, left for Imager
          u="$r/etc/systemd/system"
          test -L "$u/multi-user.target.wants/marqueet-firstboot.service"
          test -L "$u/multi-user.target.wants/marqueet-reset.path"
          test -L "$u/timers.target.wants/marqueet-update.timer"
          test -L "$u/multi-user.target.wants/marqueet-devssh.service"
          test -f "$u/marqueet-firstboot.service"
          test "$(readlink "$u/ssh.service")" = /dev/null
          test "$(readlink "$u/ssh.socket")" = /dev/null
          sudo umount "$b" "$r"
          sudo losetup -d "$loop"
          rm "$RUNNER_TEMP/check.img"
      - uses: actions/upload-artifact@v4
        with:
          name: marqueet-pi-image
          path: dist/marqueet-pi.img.xz
          retention-days: 7
          compression-level: 0
